<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Finnish Market Briefing</title>
<style>
  :root { --bg:#0f1115; --card:#171a21; --ink:#e6e8ee; --muted:#9aa3b2; --line:#2a2f3a; --accent:#5b9dff; --up:#3ddc97; --down:#ff6b6b; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  header { padding:2.2rem 1.2rem 1rem; max-width:860px; margin:0 auto; }
  h1 { margin:0; font-size:1.7rem; letter-spacing:-0.02em; }
  .sub { color:var(--muted); margin:.35rem 0 0; font-size:.92rem; }
  main { max-width:860px; margin:0 auto; padding:0 1.2rem 4rem; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:1.4rem 1.25rem; margin:1.2rem 0; overflow-wrap:anywhere; }
  h2 { font-size:1.05rem; margin:2rem 0 .6rem; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; }
  h1, h2, h3, h4 { line-height:1.3; }
  .card h1 { font-size:1.35rem; margin-top:0; }
  .card h2 { text-transform:none; letter-spacing:0; color:var(--ink); font-size:1.1rem; margin:1.4rem 0 .5rem; }
  .card h3 { font-size:1rem; margin:1.1rem 0 .4rem; }
  .card p { margin:.5rem 0; }
  .card ul, .card ol { padding-left:1.2rem; }
  .card li { margin:.2rem 0; }
  .card table { border-collapse:collapse; width:100%; margin:.8rem 0; font-size:.86rem; display:block; overflow-x:auto; }
  .card th, .card td { border:1px solid var(--line); padding:.4rem .55rem; text-align:left; white-space:nowrap; }
  .card th { background:#1e232c; position:sticky; top:0; }
  .card tr:nth-child(even) td { background:#141821; }
  .card code { background:#222835; padding:.1rem .35rem; border-radius:5px; font-size:.85em; }
  .card a { color:var(--accent); }
  .card hr { border:0; border-top:1px solid var(--line); margin:1.2rem 0; }
  .card blockquote { margin:.8rem 0; padding:.2rem 0 .2rem 1rem; border-left:3px solid var(--line); color:var(--muted); }
  #list { list-style:none; padding:0; display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:.6rem; }
  #list a { display:block; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:.7rem .85rem; color:var(--ink); text-decoration:none; font-variant-numeric:tabular-nums; }
  #list a:hover { border-color:var(--accent); }
  .note { color:var(--muted); font-size:.82rem; border-top:1px solid var(--line); margin-top:2rem; padding-top:1rem; }
  .err { color:var(--down); }
</style>
</head>
<body>
<header>
  <h1>Finnish Market Briefing</h1>
  <p class="sub">OMXH25 · weekdays · generated automatically by GitHub Actions</p>
</header>
<main>
  <div id="status" class="sub">Loading…</div>
  <article id="latest" class="card"></article>
  <h2>Archive</h2>
  <ul id="list"></ul>
  <p class="note">Automated research summary, not investment advice. Quotes may be delayed; some data can be unavailable. Always verify before trading.</p>
</main>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script>
  const statusEl = document.getElementById('status');
  const latestEl = document.getElementById('latest');
  const listEl = document.getElementById('list');

  async function text(path) {
    const r = await fetch(path, { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status + ' ' + path);
    return r.text();
  }

  async function boot() {
    let index;
    try {
      index = JSON.parse(await text('briefings/index.json'));
    } catch (e) {
      statusEl.textContent = 'No briefings published yet. The first scheduled run will add one.';
      statusEl.className = 'sub';
      latestEl.hidden = true;
      return;
    }
    const items = (index.briefings || []).filter(b => b && b.file);
    if (!items.length) {
      statusEl.textContent = 'No briefings published yet.';
      return;
    }
    statusEl.hidden = true;
    listEl.innerHTML = items.map(b =>
      `<li><a href="#${b.date}" data-file="${b.file}">${b.date}</a></li>`).join('');

    async function render(file) {
      latestEl.innerHTML = '<p class="sub">Loading briefing…</p>';
      try {
        const md = await text('briefings/' + file);
        latestEl.innerHTML = marked.parse(md);
      } catch (e) {
        latestEl.innerHTML = '<p class="err">Could not load ' + file + '</p>';
      }
    }

    listEl.addEventListener('click', (ev) => {
      const a = ev.target.closest('a[data-file]');
      if (!a) return;
      ev.preventDefault();
      history.replaceState(null, '', '#' + a.dataset.file.replace('.md', ''));
      render(a.dataset.file);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    const wanted = location.hash.slice(1);
    const initial = items.find(b => b.date === wanted) || items[0];
    render(initial.file);
  }
  boot();
</script>
</body>
</html>
